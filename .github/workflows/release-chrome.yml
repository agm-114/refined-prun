name: Release to Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute new version
        id: version
        run: |
          CURRENT=$(cat VERSION)
          IFS='.' read -r major minor patch <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) NEW="$((major + 1)).0.0" ;;
            minor) NEW="$major.$((minor + 1)).0" ;;
            patch) NEW="$major.$minor.$((patch + 1))" ;;
          esac
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "$NEW" > VERSION

      - name: Build extension
        run: pnpm build

      - name: Inject version into manifest
        run: npx dot-json@1 dist/manifest.json version "${{ steps.version.outputs.new }}"

      - name: Upload to Chrome Web Store
        run: npx chrome-webstore-upload-cli@3
        working-directory: dist
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}

      - name: Commit and tag version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Release v${{ steps.version.outputs.new }}"
          git tag "v${{ steps.version.outputs.new }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.version.outputs.new }}"
